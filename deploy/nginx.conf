worker_processes auto;

error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # Send files straight from disk to the network
    sendfile   on;
    tcp_nopush on;

    # Genome tracks and 3D structures are read a slice at a time instead of downloaded
    # whole, so a viewer may ask for many ranges of one file
    max_ranges 100;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      application/json text/plain text/css application/javascript image/svg+xml;
    # Prefer a .gz built next to a file over compressing it again on every request
    gzip_static     on;

    server {
        listen      80;
        server_name _;
        root        /srv/www;

        # Directory listings would expose the dataset layout
        autoindex off;

        # Filenames contain a content hash, so a cached copy is never the wrong one
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Revalidate files because their contents may change between builds without a new URL
        location /api/structure/models/ {
            add_header Cache-Control "no-cache";
        }

        # Preserve byte offsets for clients that read coverage tracks in ranges
        location /api/browser/coverage/ {
            add_header Cache-Control "no-cache";
            gzip        off;
            gzip_static off;
        }

        # Gene models and GWAS variants also require uncompressed byte-range responses
        location = /api/browser/models.bb {
            add_header Cache-Control "no-cache";
            gzip        off;
            gzip_static off;
        }
        location /api/browser/gwas/ {
            add_header Cache-Control "no-cache";
            gzip        off;
            gzip_static off;
        }

        # These carry the deployment's name, which changes without the files changing
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location = /404.html {
            add_header Cache-Control "no-cache";
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
        }

        # Each route has a page of its own, named directly so nginx adds no redirect;
        # anything unmatched gets the not-found page, which is the same app and reports 404
        location / {
            error_page 404 /404.html;
            try_files $uri $uri/index.html =404;
        }
    }
}
