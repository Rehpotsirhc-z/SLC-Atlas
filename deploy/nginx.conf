worker_processes auto;

error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /dev/stdout;

    # Send files straight from disk to the network
    sendfile   on;
    tcp_nopush on;

    # Genome tracks and 3D structures are read a slice at a time instead of downloaded
    # whole, so a viewer may ask for many ranges of one file
    max_ranges 100;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      application/json text/plain text/css application/javascript image/svg+xml;
    # Prefer a .gz built next to a file over compressing it again on every request
    gzip_static     on;

    server {
        listen      80;
        server_name _;
        root        /srv/www;

        # Directory listings would expose the dataset layout
        autoindex off;

        # Filenames contain a content hash, so a cached copy is never the wrong one
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Coordinate files never change once written
        location /api/structure/models/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Carries the deployment's name, which changes without the file changing
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Each route has a page of its own, named directly so nginx adds no redirect;
        # anything unmatched falls back to the shell
        location / {
            try_files $uri $uri/index.html /index.html;
        }
    }
}
