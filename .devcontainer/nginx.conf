# HTTP — set server_name to your domain once you have one.
# To add HTTPS: uncomment the second server block, add your cert paths,
# and add "443:443" + a cert volume to docker-compose.yml.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    server {
        listen 80;
        server_name _;

        root  /workspace/frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HTTPS (uncomment after obtaining a cert) ──────────────────────────────
    # server {
    #     listen 443 ssl;
    #     server_name example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     root  /workspace/frontend/dist;
    #     index index.html;
    #
    #     location /api/ {
    #         proxy_pass         http://127.0.0.1:8000;
    #         proxy_set_header   Host              $host;
    #         proxy_set_header   X-Real-IP         $remote_addr;
    #         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
    # Also add to docker-compose.yml ports: "443:443"
    # and mount your certs: - /path/to/certs:/etc/nginx/certs:ro
}
