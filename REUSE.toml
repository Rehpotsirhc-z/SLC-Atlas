version = 1
SPDX-PackageName = "SLC Atlas"
SPDX-PackageSupplier = "Dong Lab, Yale School of Medicine <https://donglab.org>"

[[annotations]]
path = [
  "web/package.json",
  "web/package-lock.json",
  "web/tsconfig.json",
  "web/tsconfig.app.json",
  "web/tsconfig.node.json",
  "web/index.html",
  "zellij-layout.kdl",
  ".gitattributes",
  "README.org",
