version = 1
SPDX-PackageName = "AtlasForge"
SPDX-PackageSupplier = "Dong Lab, Yale School of Medicine <https://donglab.org>"

[[annotations]]
path = [
  "web/package.json",
  "web/package-lock.json",
  "web/tsconfig.json",
  "web/tsconfig.app.json",
  "web/tsconfig.node.json",
  "web/index.html",
  "cspell.json",
  "zellij-layout.kdl",
  ".gitattributes",
  ".devcontainer/README.org",
  ".devcontainer/devcontainer-lock.json",
  "README.org",
  "scripts/screenshots/README.org",
  "screenshots/**",
  "docs/*.org",
  "scripts/benchmarks/**",
  "src/atlasforge/pipeline/templates/**",
  "web/src/views/Expression/Anatomograms/anatomogram/ATTRIBUTION.org",
  "web/public/ATTRIBUTION.org"
]
SPDX-FileCopyrightText = "2026 Dong Lab, Yale School of Medicine <https://donglab.org>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "web/src/views/Expression/Anatomograms/anatomogram/*.svg"
SPDX-FileCopyrightText = "EMBL-EBI (Expression Atlas anatomogram)"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
  "web/public/favicon.svg",
  "web/public/favicon.ico",
  "web/public/apple-touch-icon.png",
  "web/public/icon-192.png",
  "web/public/icon-512.png",
  "web/public/icon-maskable-512.png",
  "docs/atlasforge-icon.png"
]
SPDX-FileCopyrightText = [
  "2026 Dong Lab, Yale School of Medicine <https://donglab.org>",
  "2024 Fonticons, Inc. (Font Awesome Free 6.7.2 DNA icon)"
]
SPDX-License-Identifier = "CC-BY-4.0"
