volumes:
  # Persisted /usr/local — keeps anything installed there (e.g. npm globals,
  # /usr/local/bin tools) across container rebuilds.
  devtools:
  # Persisted /home/ubuntu — shell config, zellij install, etc.
  home:

services:
  dev:
    container_name: slc-atlas
    user: ubuntu
    working_dir: /workspace

    build:
      context: .
      dockerfile: .docker/Dockerfile

    ports:
      - "8000:8000" # FastAPI backend
      - "3000:3000" # Vite frontend dev server
      - "80:80" # NGINX frontend production server

    volumes:
      - .:/workspace
      - devtools:/usr/local
      - home:/home/ubuntu
