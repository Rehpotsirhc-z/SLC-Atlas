volumes:
  atlas-site:

services:
  atlas:
    image: ghcr.io/thedonglab/atlasforge:latest
    restart: unless-stopped
    container_name: atlas

    ports:
      - "8080:80"

    volumes:
      - ./data:/data:ro
      # The site is rebuilt from the dataset on every start, so keep it out of the
      # container's own filesystem
      - atlas-site:/srv/www

    environment:
      ATLASFORGE_APP_NAME: SLC Gene Family Atlas
      ATLASFORGE_APP_SHORT_NAME: SLC Atlas
      ATLASFORGE_APP_DESCRIPTION: SLC gene family atlas across annotation, clustering, conservation, genomic context, expression, and 3D structure views.
      ATLASFORGE_FAMILY_LABEL: SLC
      ATLASFORGE_DOWNLOAD_PREFIX: slc
