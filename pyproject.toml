[build-system]
requires = ["hatchling", "hatch-vcs", "pypandoc-binary"]
build-backend = "hatchling.build"

[project]
name = "atlasforge"
dynamic = ["version", "readme"]
description = "A framework that turns any gene family into a self-hosted web atlas of cross-linked annotation, expression, conservation, clustering, and 3D structure views"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "polars>=1.0",
  "pyarrow>=17",
  "pydantic>=2.8",
  "pydantic-settings>=2.5",
  "rich>=13",
]

[project.optional-dependencies]
pipeline = ["biopython>=1.83", "scipy>=1.13", "numpy>=1.26", "pybigtools>=0.3"]
dev = ["black>=24.0", "reuse[charset-normalizer]>=5.0", "parquet-tools>=0.2.16"]

[project.scripts]
atlasforge = "atlasforge.cli:main"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasforge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/hatch_build.py", "/README.org", "/REUSE.toml", "/LICENSE", "/LICENSES"]
artifacts = ["web/dist/**"]

# Run `npm --prefix web run build` before building a wheel
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "atlasforge/web"

[tool.black]
line-length = 100
target-version = ["py312"]
